[MODE]
# false = backtest / paper
# true  = live trading
live = false


[DATA]
# CSV directory for backtest / paper mode
csv_dir = data/nifty_50

# VIX CSV file path (used in signal_engine / backtest)
vix_csv = data/nifty_50/vix.csv

# Format: YYYY-MM-DD
# Used ONLY for backtest / paper
from_date = 2017-01-01
to_date   = 2021-12-31
generate_pdf = true
generate_charts = true


[PORTFOLIO]
# Total starting capital
initial_capital = 2500000

# HARD cap – never exceed this
max_positions = 50

# Exit management
max_hold_days = 90
partial_profit_pct = 0.10
partial_exit_ratio = 0.3

# Optional (future use)
# position_size_pct = 4


[EXECUTION]
# paper | enctoken | api
method = enctoken


[ZERODHA_ENCTOKEN]
# Browser-based session token
# Required only when live = true and method = enctoken
enctoken = PUT_YOUR_ENCTOKEN_HERE


[ZERODHA_API]
# Required only when method = api
api_key =
access_token =
